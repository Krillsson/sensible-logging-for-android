name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

  apple-tests:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Run Apple tests
      run: ./gradlew :core:macosArm64Test :core:iosSimulatorArm64Test

    - name: Build the macOS framework
      run: ./gradlew :core:linkDebugFrameworkMacosArm64

    - name: Compile and run the Swift sample
      run: |
        FRAMEWORK_DIR=core/build/bin/macosArm64/debugFramework
        swiftc -F "$FRAMEWORK_DIR" -framework SensibleLogging \
          -Xlinker -rpath -Xlinker "@executable_path/$FRAMEWORK_DIR" \
          swift/Logger.swift swift/sample/main.swift -o swift-sample
        ./swift-sample | tee swift-sample.log
        grep -q "main.swift:run()" swift-sample.log
        grep -q "\[DEBUG\] \[Network\]" swift-sample.log
        grep -q "host\]:nas.local" swift-sample.log
        grep -q "exception\[sample failure\]" swift-sample.log
        grep -q "SampleError" swift-sample.log
